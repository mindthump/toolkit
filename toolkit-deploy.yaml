apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: toolkit-app
  name: toolkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toolkit-app
  template:
    metadata:
      labels:
        app: toolkit-app
    spec:
      containers:
      - name: toolkit-container
        image: docker.io/mindthump/toolkit:main
        imagePullPolicy: Always
        command: ["/bin/bash"]
        args: ["-c", "trap : TERM INT; sleep infinity & wait"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
