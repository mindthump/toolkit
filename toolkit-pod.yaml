apiVersion: v1
kind: Pod
metadata:
  name: toolkit-pod
  labels:
    app: toolkit
spec:
  containers:
    - name: toolkit-container
      image: mindthump/toolkit:main
      imagePullPolicy: IfNotPresent # Don't worry if it's a little stale
      command: ["/bin/bash"]
      args: ["-c", "trap : TERM INT; sleep infinity & wait"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
